services:
  controller:
    build:
      context: ..
      dockerfile: Dockerfile
    image: geoscope-controller:local
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    env_file:
      - ./controller.env
    environment:
      APP_DATA_DIR: /data
    volumes:
      - controller-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 30s

volumes:
  controller-data:
